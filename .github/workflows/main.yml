name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  mac-desktop:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Set Password & Install VNC Server
        run: |
          # Set password for 'runner'
          sudo dscl . -passwd /Users/runner '0697' || true
          
          # Install lightweight VNC server that handles headless displays cleanly
          brew install mac-vnc || brew install tightvnc || true

          # Enable Apple Remote Desktop / VNC server with forced screen wake
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all \
            -configure -clientopts -setvnclegacy yes -setvncpw '0697' \
            -restart -agent

          # Force display server to stay awake in headless mode
          sudo caffeinate -u -t 3600 &

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-mac-${{ github.run_id }}

      - name: Fetch Tailscale IP & Keep Alive
        run: |
          TS_IP=$(tailscale ip -4)
          echo "=== macOS VNC ACCESS ==="
          echo "VNC Address: $TS_IP:5900"
          echo "Username: runner"
          echo "Password: 0697"
          echo "========================"
          
          while true; do
            echo "[$(date)] macOS VNC Runner Active..."
            sleep 300
          done
