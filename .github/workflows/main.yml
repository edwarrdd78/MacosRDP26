name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  mac-desktop:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Configure User Password & Kickstart ARD
        run: |
          # 1. Update password hash directly via dscl to avoid eDSAuthFailed
          sudo dscl . -create /Users/runner UserShell /bin/zsh
          sudo dsadmin -u runner -p '0697' 2>/dev/null || sudo dscl . -passwd /Users/runner '0697' '0697' 2>/dev/null || true
          
          # 2. Configure Apple Remote Desktop properly with clean kickstart flags
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy yes -setvncpw '0697' \
            -restart -agent -console

      - name: Fix Headless Black Screen (Virtual Display Buffer)
        run: |
          # Install TigerVNC via Homebrew
          brew install tigervnc
          
          # Force resolution and spawn a virtual display frame buffer
          vncserver :1 -geometry 1280x800 -depth 24 -SecurityTypes None &
          
          # Force power management to keep display context active
          sudo caffeinate -u -t 3600 &

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-mac-${{ github.run_id }}

      - name: Fetch Tailscale IP & Keep Alive
        run: |
          TS_IP=$(tailscale ip -4)
          echo "=== macOS VNC ACCESS ==="
          echo "Native VNC Port: $TS_IP:5900"
          echo "TigerVNC Virtual Port: $TS_IP:5901"
          echo "Username: runner"
          echo "Password: 0697"
          echo "========================"
          
          while true; do
            echo "[$(date)] macOS VNC Runner Active..."
            sleep 300
          done
