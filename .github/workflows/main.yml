name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  mac-desktop:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Configure User Password & Enable VNC
        run: |
          # Set 'runner' password to 0697 via dscl (bypasses Secure Token requirement)
          sudo dscl . -passwd /Users/runner '0697' || true
          
          # Force set legacy VNC password and allow all users access via ARD Kickstart
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all \
            -configure -clientopts -setvnclegacy yes -setvncpw '0697' \
            -restart -agent

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-mac-${{ github.run_id }}

      - name: Fetch Tailscale IP & Keep Alive
        run: |
          TS_IP=$(tailscale ip -4)
          echo "=== macOS VNC ACCESS ==="
          echo "Connect via VNC (not RDP) in Remmina:"
          echo "Address: $TS_IP:5900"
          echo "Username: runner"
          echo "Password: 0697"
          echo "========================"
          
          while true; do
            echo "[$(date)] macOS VNC Runner Active..."
            sleep 300
          done
