name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  mac-desktop:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Passwords & Enable VNC
        run: |
          # 1. Set runner user password
          sudo dscl . -passwd /Users/runner '0697' || true
          
          # 2. Enable ARD access for all users
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all
            
          # 3. Set VNC legacy password separately
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy yes -setvncpw '0697'
            
          # 4. Restart ARD Agent
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent -console

      - name: Force WindowServer Display Rendering
        run: |
          # Create virtual display session via WindowServer
          sudo clp service enable 2>/dev/null || true
          
          # Force user session login to wake the display context
          sudo launchctl kickstart -k system/com.apple.WindowServer || true
          
          # Prevent sleep in headless mode
          sudo caffeinate -u -t 3600 &

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-mac-${{ github.run_id }}

      - name: Fetch Tailscale IP & Keep Alive
        run: |
          TS_IP=$(tailscale ip -4)
          echo "=== macOS VNC ACCESS ==="
          echo "Address: $TS_IP:5900"
          echo "Username: runner"
          echo "Password: 0697"
          echo "========================"
          
          while true; do
            echo "[$(date)] macOS VNC Runner Active..."
            sleep 300
          done
