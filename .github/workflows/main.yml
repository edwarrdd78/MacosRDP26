name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  mac-desktop:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Passwords & Enable VNC
        run: |
          # Change password for 'runner' using sysadminctl (resets password directly)
          sudo sysadminctl -resetPasswordFor runner -newPassword '0697'
          
          # Enable and set password for 'root'
          sudo dscl . -create /Users/root UserShell /bin/zsh
          sudo sysadminctl -resetPasswordFor root -newPassword '0697'
          
          # Enable Apple Remote Desktop / VNC server with password '0697'
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw '0697' \
            -restart -agent -privs -all

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-mac-${{ github.run_id }}

      - name: Fetch Tailscale IP & Keep Alive
        run: |
          TS_IP=$(tailscale ip -4)
          echo "=== macOS VNC ACCESS ==="
          echo "VNC URL: vnc://$TS_IP:5900"
          echo "Username: runner"
          echo "Password: 0697"
          echo "========================"
          
          while true; do
            echo "[$(date)] macOS VNC Runner Active..."
            sleep 300
          done
